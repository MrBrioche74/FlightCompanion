name: Validate source
on:
  push:
    branches: [ main ]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          test -f FlightCompanion/FlightCompanion.csproj
          test -f FlightCompanion/MainWindow.xaml
          test -f FlightCompanion/MainWindow.xaml.cs
